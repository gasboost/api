name: Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  check-versions:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      publish-gemini: ${{ steps.check-gemini.outputs.publish }}
      publish-openai: ${{ steps.check-openai.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: check-gemini
        run: |
          set -eu
          name=$(node -p 'require("./packages/gemini/package.json").name')
          version=$(node -p 'require("./packages/gemini/package.json").version')
          npm_view_output=$(mktemp)
          if npm view "$name@$version" version >"$npm_view_output" 2>&1; then
            echo "$name@$version is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' "$npm_view_output"; then
            cat "$npm_view_output"
            echo "$name@$version is not published"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$npm_view_output"
            echo "Failed to check $name@$version on npm registry" >&2
            exit 1
          fi
      - id: check-openai
        run: |
          set -eu
          name=$(node -p 'require("./packages/openai/package.json").name')
          version=$(node -p 'require("./packages/openai/package.json").version')
          npm_view_output=$(mktemp)
          if npm view "$name@$version" version >"$npm_view_output" 2>&1; then
            echo "$name@$version is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' "$npm_view_output"; then
            cat "$npm_view_output"
            echo "$name@$version is not published"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$npm_view_output"
            echo "Failed to check $name@$version on npm registry" >&2
            exit 1
          fi

  publish-gemini:
    needs: check-versions
    if: needs.check-versions.outputs.publish-gemini == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm --filter @gasboost/gemini pack:smoke
      - run: pnpm --filter @gasboost/gemini publish --access public --no-git-checks

  publish-openai:
    needs: check-versions
    if: needs.check-versions.outputs.publish-openai == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm --filter @gasboost/openai pack:smoke
      - run: pnpm --filter @gasboost/openai publish --access public --no-git-checks
